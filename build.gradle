plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.inventory'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) } }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(Jar).configureEach { from(rootProject.files('LICENSE', 'NOTICE')) }
}

tasks.register('checkDocs', Exec) {
    commandLine 'python3', 'scripts/check_docs.py'
}
tasks.named('assemble') { dependsOn ':fabric:assemble' }
tasks.named('check') { dependsOn ':fabric:check', 'checkDocs' }
tasks.register('test') { dependsOn ':fabric:test', 'checkDocs' }
